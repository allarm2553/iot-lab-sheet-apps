<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="50%" stop-color="#1e293b" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>
    <linearGradient id="neonGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#06b6d4" />
      <stop offset="50%" stop-color="#3b82f6" />
      <stop offset="100%" stop-color="#8b5cf6" />
    </linearGradient>
    <linearGradient id="boltGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#60a5fa" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="16" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background Rounded Base -->
  <rect width="512" height="512" rx="112" fill="url(#bgGrad)" />
  <rect x="16" y="16" width="480" height="480" rx="96" fill="none" stroke="url(#neonGrad)" stroke-width="4" opacity="0.6" />

  <!-- Outer IoT Circuit Halo -->
  <circle cx="256" cy="256" r="170" fill="none" stroke="url(#neonGrad)" stroke-width="6" stroke-dasharray="16 12" opacity="0.7" />
  
  <!-- Node Dots -->
  <circle cx="256" cy="86" r="10" fill="#06b6d4" filter="url(#glow)" />
  <circle cx="426" cy="256" r="10" fill="#3b82f6" filter="url(#glow)" />
  <circle cx="256" cy="426" r="10" fill="#8b5cf6" filter="url(#glow)" />
  <circle cx="86" cy="256" r="10" fill="#06b6d4" filter="url(#glow)" />

  <!-- Center Hexagon / Shield -->
  <polygon points="256,120 376,190 376,322 256,392 136,322 136,190" fill="rgba(30, 41, 59, 0.85)" stroke="url(#neonGrad)" stroke-width="8" filter="url(#glow)" />

  <!-- Lightning / Fast Wave Icon in Center -->
  <path d="M272 160 L180 276 L248 276 L236 352 L332 236 L264 236 Z" fill="url(#boltGrad)" filter="url(#glow)" />
</svg>
